<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Expediente | Ruta Segura Pro</title>

<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/mobile.css">

</head>

<body>

<header class="header">

<h1>Expediente Inteligente</h1>

<p>Comienza a construir tu historia paso a paso.</p>

</header>

<main class="container">

<div class="progress">

<div class="progress-bar" id="progressBar"></div>

</div>
<section class="panel">

<h2>Asistente Inteligente</h2>

<p id="preguntaIA">

¿Por qué saliste de tu país?

</p>

<input

type="text"

id="respuestaIA"

placeholder="Escribe aquí...">

<button

type="button"

id="btnResponder">

Responder

</button>

</section>
<form id="expedienteForm">

<label>Nombre completo</label>

<input
type="text"
id="nombre"
placeholder="Escribe tu nombre">

<label>País de origen</label>

<input
type="text"
id="pais">

<label>Fecha de salida</label>

<input
type="date"
id="salida">

<label>Fecha de ingreso a México</label>

<input
type="date"
id="ingreso">

<label>¿Qué ocurrió?</label>

<textarea
id="hechos"
rows="8"
placeholder="Describe tu historia..."></textarea>

<button type="submit">

Guardar expediente

</button>

</form>

<section class="panel">

<h2>Resumen automático</h2>

<div id="resumen">

Todavía no hay información.

</div>

</section>

</main>

<script src="js/storage.js"></script>

<script src="js/ia.js"></script>

<script src="js/timeline.js"></script>

<script src="js/chat.js"></script>

<script src="js/expediente.js"></script>

<script src="js/chat-ui.js"></script>

</body>

</html>

<section class="panel">

<h2>Cronología detectada</h2>

<div id="cronologia">

Aún no hay eventos.

</div>

</section>
